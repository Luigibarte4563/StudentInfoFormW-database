<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#4F46E5', // Indigo 600
                        'primary-dark': '#1F2937', // Gray 800
                        'accent-yellow': '#FBBF24', // Amber 400
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            /* Subtle background pattern for depth */
            background-color: #eef2ff;
            background-image: radial-gradient(#d1d5db 1px, transparent 0);
            background-size: 20px 20px;
        }

        /* Custom scrollbar for list */
        #studentListContainer {
            max-height: 60vh;
            overflow-y: auto;
            min-height: 200px;
            /* Scrollbar styling for modern browsers */
            scrollbar-width: thin;
            scrollbar-color: #4f46e5 #e0e7ff;
        }
        #studentListContainer::-webkit-scrollbar {
            width: 8px;
        }
        #studentListContainer::-webkit-scrollbar-track {
            background: #eef2ff;
        }
        #studentListContainer::-webkit-scrollbar-thumb {
            background-color: #818cf8;
            border-radius: 20px;
            border: 2px solid #eef2ff;
        }

        /* Input hover effects */
        input:focus {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.4);
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="min-h-screen p-4 sm:p-8 flex justify-center items-start pt-10">

    <div id="app-container" class="w-full max-w-4xl bg-white shadow-2xl rounded-2xl overflow-hidden backdrop-blur-sm bg-opacity-95">
        
        <header class="p-6 bg-primary-dark text-white shadow-xl">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">
                Student Enrollment Form
            </h1>
        </header>
        
        <nav class="flex border-b border-gray-100 bg-gray-50 p-2">
            <button id="nav-form" 
                    class="flex-1 py-3 px-4 text-sm font-semibold rounded-xl transition-all duration-300 ease-in-out flex items-center justify-center text-white bg-primary-blue shadow-md hover:bg-indigo-700 mx-1" 
                    onclick="switchView('form')">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>
                New Application
            </button>
            <button id="nav-list" 
                    class="flex-1 py-3 px-4 text-sm font-semibold rounded-xl transition-all duration-300 ease-in-out flex items-center justify-center text-gray-700 bg-transparent hover:bg-white hover:text-primary-blue mx-1" 
                    onclick="switchView('list')">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Public Roster
            </button>
        </nav>

        <div class="p-6 sm:p-8">

            <div id="view-form" class="view-section">
                <h2 class="text-xl sm:text-2xl font-bold text-primary-dark mb-6">Submit Your Enrollment Application</h2>
                <form id="studentForm" class="space-y-6">
                    
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="name" required 
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-4 focus:ring-primary-blue/30 focus:border-primary-blue transition duration-200 shadow-sm" 
                               placeholder="e.g., lowigi varti">
                    </div>

                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label for="studentId" class="block text-sm font-medium text-gray-700 mb-1">Student ID (Unique)</label>
                            <input type="text" id="studentId" required 
                                   class="w-full p-3 border border-gray-300 rounded-lg focus:ring-4 focus:ring-primary-blue/30 focus:border-primary-blue transition duration-200 shadow-sm" 
                                   placeholder="e.g., 34-0420-143">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                            <input type="email" id="email" required 
                                   class="w-full p-3 border border-gray-300 rounded-lg focus:ring-4 focus:ring-primary-blue/30 focus:border-primary-blue transition duration-200 shadow-sm" 
                                   placeholder="lowigi@gmail.com">
                        </div>
                    </div>
                    
                    <div>
                        <label for="major" class="block text-sm font-medium text-gray-700 mb-1">Major/Program</label>
                        <input type="text" id="major" required 
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-4 focus:ring-primary-blue/30 focus:border-primary-blue transition duration-200 shadow-sm" 
                               placeholder="e.g., Information Technology">
                    </div>
                    
                    <button type="submit" 
                            class="w-full py-4 mt-6 bg-primary-blue text-white font-bold rounded-xl text-lg hover:bg-indigo-700 transition duration-300 ease-in-out transform hover:scale-[1.005] shadow-lg hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-primary-blue/50">
                        Enroll Student Now
                    </button>
                </form>
            </div>

            <div id="view-list" class="view-section hidden">
                <h2 class="text-xl sm:text-2xl font-bold text-primary-dark mb-6">Current Public Student Roster</h2>
                
                <div class="mb-6 relative">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute inset-y-0 left-0 top-1/2 -translate-y-1/2 flex items-center pl-3 text-gray-400"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" id="searchStudent" onkeyup="filterStudents()" 
                           class="w-full p-3 pl-10 border border-gray-300 rounded-xl focus:ring-4 focus:ring-accent-yellow/30 focus:border-accent-yellow transition duration-200 shadow-md text-base" 
                           placeholder="Search by Name, ID, or Major...">
                </div>

                <div id="studentListContainer" class="rounded-xl border border-gray-100 p-2 bg-gray-50 shadow-inner">
                    <ul id="studentList" class="space-y-4">
                        <li class="p-4 bg-gray-200 rounded-lg text-gray-600 text-center text-sm">
                            Real-time data stream: Establishing connection...
                        </li>
                    </ul>
                </div>
                
            </div>

        </div>

    </div>

    <div id="messageBox" class="fixed bottom-5 right-5 p-4 rounded-xl text-white shadow-2xl transition-all duration-500 ease-in-out transform translate-x-full opacity-0 z-50 min-w-[200px]"></div>

    <script>
        // Define SVG strings for the icons used in the list view (replacing emojis)
        const iconVerified = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="inline-block align-middle text-green-500"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>';
        const iconPending = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="inline-block align-middle text-yellow-800"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
        const iconNotFound = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="block mb-2 mx-auto text-gray-400"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>';

        // Store all students globally for filtering
        let allStudentsData = [];
        
        // --- UI Logic: Tabs and Messages ---

        /**
         * Custom toast message box instead of alert()
         */
        function showMessage(message, isError = false) {
            const msgBox = document.getElementById('messageBox');
            
            // Reset classes
            msgBox.className = 'fixed bottom-5 right-5 p-4 rounded-xl text-white shadow-2xl transition-all duration-500 ease-in-out z-50 min-w-[200px]';
            
            if (isError) {
                msgBox.classList.add('bg-red-600', 'border-2', 'border-red-400');
            } else {
                msgBox.classList.add('bg-green-600', 'border-2', 'border-green-400');
            }
            
            msgBox.textContent = message;
            
            // Show the message
            setTimeout(() => {
                msgBox.classList.remove('translate-x-full', 'opacity-0');
                msgBox.classList.add('translate-x-0', 'opacity-100');
            }, 10);

            // Hide the message after 4 seconds
            setTimeout(() => {
                msgBox.classList.remove('translate-x-0', 'opacity-100');
                msgBox.classList.add('translate-x-full', 'opacity-0');
            }, 4000);
        }

        /**
         * Toggles the visible section (Form or List) and updates the navigation styling.
         */
        function switchView(viewName) {
            const formView = document.getElementById('view-form');
            const listView = document.getElementById('view-list');
            const navForm = document.getElementById('nav-form');
            const navList = document.getElementById('nav-list');

            const activeClasses = ['bg-primary-blue', 'text-white', 'shadow-md', 'hover:bg-indigo-700'];
            const inactiveClasses = ['bg-transparent', 'text-gray-700', 'hover:text-primary-blue', 'hover:bg-white', 'shadow-none'];

            if (viewName === 'form') {
                formView.classList.remove('hidden');
                listView.classList.add('hidden');

                // Activate Form Button
                navForm.classList.add(...activeClasses);
                navForm.classList.remove(...inactiveClasses);
                
                // Deactivate List Button
                navList.classList.add(...inactiveClasses);
                navList.classList.remove(...activeClasses);
                
            } else if (viewName === 'list') {
                formView.classList.add('hidden');
                listView.classList.remove('hidden');

                // Activate List Button
                navList.classList.add(...activeClasses);
                navList.classList.remove(...inactiveClasses);
                
                // Deactivate Form Button
                navForm.classList.add(...inactiveClasses);
                navForm.classList.remove(...activeClasses);
            }
        }

        // --- Firebase Configuration and Initialization (Original Logic Retained) ---
        const firebaseConfig = {
            apiKey: "AIzaSyAvQJ5ts2sLNbroz4h1Gcj6Lwq8UNu5KBs",
            authDomain: "studentinfo-3b29f.firebaseapp.com",
            databaseURL: "https://studentinfo-3b29f-default-rtdb.firebaseio.com",
            projectId: "studentinfo-3b29f",
            storageBucket: "studentinfo-3b29f.firebasestorage.app",
            messagingSenderId: "890030823969",
            appId: "1:890030823969:web:1121ffbdc0602e74c32160",
            measurementId: "G-N50H4H4PS6"
        };

        let studentsRef;

        try {
            const app = firebase.initializeApp(firebaseConfig);
            const database = app.database();
            // Using 'students' path as per the original code
            studentsRef = database.ref('students');
        } catch (e) {
            console.error("Firebase Initialization Error:", e);
            showMessage("Initialization failed. Check console for database issues.", true);
        }

        // --- 1. Form Submission Logic (Data Persistence) ---
        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            if (!studentsRef) {
                showMessage("Database connection failed. Cannot submit.", true);
                return; 
            }

            const name = document.getElementById('name').value.trim();
            const studentId = document.getElementById('studentId').value.trim();
            const email = document.getElementById('email').value.trim();
            const major = document.getElementById('major').value.trim();

            if (!name || !studentId || !email || !major) {
                showMessage('Please fill in all enrollment fields.', true);
                return;
            }

            const studentData = {
                name: name,
                studentId: studentId,
                email: email,
                major: major,
                verified: false, // Default status
                timestamp: new Date().toISOString()
            };

            studentsRef.push(studentData)
                .then(() => {
                    showMessage(`Enrollment successful for ${name}. Status: Pending Verification.`, false);
                    document.getElementById('studentForm').reset();
                    // Switch to list view after submission
                    switchView('list');
                })
                .catch((error) => {
                    console.error('Error submitting data: ', error);
                    showMessage('Error submitting data. Check console.', true);
                });
        });

        // --- 2. Real-Time List Display & Filtering Logic ---
        
        /**
         * Renders the student list based on the provided filtered array.
         */
        function renderStudentList(studentsToDisplay) {
            const studentListElement = document.getElementById('studentList');
            studentListElement.innerHTML = ''; // Clear the current list

            if (studentsToDisplay.length === 0) {
                studentListElement.innerHTML = `
                    <li class="p-6 bg-white rounded-xl text-gray-700 text-center shadow-inner border border-yellow-200">
                        ${iconNotFound}
                        No students found matching your search criteria.
                    </li>
                `;
                return;
            }

            studentsToDisplay.forEach((student) => {
                const isVerified = student.data.verified === true;
                const listItem = document.createElement('li');
                
                const verifiedClass = isVerified 
                    ? 'border-l-4 border-green-500 bg-white hover:shadow-green-100' 
                    : 'border-l-4 border-accent-yellow bg-white hover:shadow-yellow-100';
                
                const badgeClass = isVerified 
                    ? 'bg-green-100 text-green-800' 
                    : 'bg-accent-yellow/20 text-yellow-800';
                
                const icon = isVerified ? iconVerified : iconPending;
                const badgeText = isVerified ? 'VERIFIED' : 'PENDING';

                listItem.className = `p-4 rounded-xl shadow-lg transition duration-200 ease-in-out transform hover:scale-[1.01] ${verifiedClass} cursor-pointer`;
                
                listItem.innerHTML = `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-2">
                        <strong class="text-xl text-primary-dark font-semibold mb-1 sm:mb-0">${student.data.name}</strong>
                        <span class="inline-flex items-center px-3 py-1 text-xs font-bold rounded-full ${badgeClass} self-start sm:self-auto">
                            ${icon} <span class="ml-1">${badgeText}</span>
                        </span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 text-sm text-gray-600 gap-y-1"> 
                        <p class="truncate">
                            <span class="font-medium text-gray-500">ID:</span> 
                            <span class="font-mono text-primary-blue">${student.data.studentId}</span>
                        </p>
                        <p class="truncate sm:text-right">
                            <span class="font-medium text-gray-500">Major:</span> 
                            <span class="text-primary-dark font-medium">${student.data.major}</span>
                        </p>
                    </div>
                    <p class="text-xs text-gray-500 mt-1 truncate">
                        ${student.data.email}
                    </p>
                `;
                
                studentListElement.appendChild(listItem);
            });
        }
        
        /**
         * Filters the global student list based on the search input value.
         */
        function filterStudents() {
            const searchInput = document.getElementById('searchStudent');
            const query = searchInput.value.toLowerCase().trim();
            
            if (!query) {
                renderStudentList(allStudentsData);
                return;
            }

            const filteredStudents = allStudentsData.filter(student => {
                const data = student.data;
                return (
                    data.name.toLowerCase().includes(query) ||
                    data.studentId.toLowerCase().includes(query) ||
                    data.major.toLowerCase().includes(query) ||
                    data.email.toLowerCase().includes(query)
                );
            });

            renderStudentList(filteredStudents);
        }


        // Setup Real-Time Listener
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize view to form first
            switchView('form');
            
            if (studentsRef) {
                // Listen for value changes at the 'students' reference
                studentsRef.on('value', (snapshot) => {
                    const tempStudents = [];

                    if (!snapshot.exists()) {
                        allStudentsData = [];
                        renderStudentList([]); // Render empty list
                        return;
                    }

                    // Iterate through the snapshot and populate the temporary array
                    snapshot.forEach((childSnapshot) => {
                        const studentKey = childSnapshot.key;
                        const studentData = childSnapshot.val();
                        tempStudents.push({
                            key: studentKey,
                            data: studentData
                        });
                    });
                    
                    // Sort by timestamp (newest first)
                    tempStudents.sort((a, b) => (new Date(b.data.timestamp) - new Date(a.data.timestamp)));

                    // Update the global student data array
                    allStudentsData = tempStudents;
                    
                    // Re-filter and render the list
                    filterStudents();

                }, (error) => {
                    console.error("Error reading database:", error);
                    showMessage(`Error loading data: ${error.message}`, true);
                });
            }
        });
    </script>
</body>
</html>
